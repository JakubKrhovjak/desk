[ids]
03f0:9a4a

# Klik myši keyd nevidí: delší držení Command bez další klávesy nesmí po puštění spustit ťuknutí (F22, F24)
[global]
overload_tap_timeout = 200

# Tahle klávesnice posílá Alt a Win prohozené: klávesa s logem Windows chodí jako leftalt, Alt jako leftmeta.
# Aliasy pojmenují klávesy podle popisků, vazby v ~/.config/desk/keyd-mode.sh pak platí stejně i pro Dell.
[aliases]
leftalt = hostwin
rightalt = hostwin
leftmeta = hostalt
rightmeta = hostaltgr

[main]
hostwin = layer(meta)
hostalt = layer(alt)
hostaltgr = layer(altgr)

include desk-cmd

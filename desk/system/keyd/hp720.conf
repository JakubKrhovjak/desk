[ids]
03f0:9a4a

# Klik myši keyd nevidí: delší držení Command bez další klávesy nesmí po puštění spustit ťuknutí (F22, F24)
[global]
overload_tap_timeout = 200

# Mapuje se podle toho, co klávesa posílá (změřeno 2026-11-07): Alt = leftalt, klávesa s logem Windows = leftmeta.
# Aliasy pojmenují klávesy pro vazby v ~/.config/desk/keyd-mode.sh, ty pak platí stejně i pro Dell.
[aliases]
leftmeta = hostwin
rightmeta = hostwin
leftalt = hostalt
rightalt = hostaltgr

[main]
hostwin = layer(vt)
hostalt = layer(alt)
hostaltgr = layer(altgr)

include desk-cmd

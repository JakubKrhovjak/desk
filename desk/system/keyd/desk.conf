[ids]
# HP 720 (Bluetooth) a Dell KB216; obě se mapují podle toho, co klávesy posílají (HP změřeno 2026-11-07, bez prohození)
03f0:9a4a
413c:2113

# Klik myši keyd nevidí: delší držení Command bez další klávesy nesmí po puštění spustit ťuknutí (F22, F24)
[global]
overload_tap_timeout = 200

# Alt = leftalt, klávesa s logem Windows = leftmeta. Aliasy pojmenují klávesy pro vazby v ~/.config/desk/keyd-mode.sh.
[aliases]
leftmeta = hostwin
rightmeta = hostwin
leftalt = hostalt
rightalt = hostaltgr

[main]
hostwin = layer(vt)
hostalt = layer(alt)
hostaltgr = layer(altgr)

include desk-cmd

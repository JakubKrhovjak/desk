[ids]
413c:2113

# Klik myši keyd nevidí: delší držení Command bez další klávesy nesmí po puštění spustit ťuknutí (F22, F24)
[global]
overload_tap_timeout = 200

# Aliasy pojmenují klávesy podle popisků, vazby v ~/.config/desk/keyd-mode.sh pak platí stejně i pro HP 720.
[aliases]
leftmeta = hostwin
rightmeta = hostwin
leftalt = hostalt
rightalt = hostaltgr

[main]
hostwin = layer(vt)
hostalt = layer(alt)
hostaltgr = layer(altgr)

include desk-cmd
